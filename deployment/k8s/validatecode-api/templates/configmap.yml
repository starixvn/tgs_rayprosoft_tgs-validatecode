apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "validatecode-api.fullname" . }}
data:
  appsettings.json: |
    {
      "ConnectionStrings": {
        "Tgs": "{{ .Values.connectionStrings.tgs }}",
        "RedisConfigurationString": "{{ .Values.connectionStrings.redis }}"
      }
    }
